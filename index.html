<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Fātiḥah</title>
<meta name="description" content="Sūrat al-Fātiḥah written on a parchment in the dark, verse by verse, and raised into gold.">
<meta name="theme-color" content="#000000">
<!-- the piece always begins at its beginning — no restored scroll position on reload -->
<script>if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; if (scrollY > 0) scrollTo(0, 0);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=IBM+Plex+Mono:wght@400&family=Amiri+Quran&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2301030D'/%3E%3Cg fill='%23C9A45B'%3E%3Crect x='18' y='18' width='28' height='28'/%3E%3Crect x='18' y='18' width='28' height='28' transform='rotate(45 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5.5' fill='%2301030D'/%3E%3C/svg%3E">
<style>
  :root { --gold: #C9A45B; --gold-dim: #8F7440; --muted: #A2957A; --text: #E7DDC6;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --arabic: "Amiri Quran", "Amiri", "Geeza Pro", serif; }
  html, body { margin: 0; background: #000; color: var(--muted); }
  /* the scroll track: the chapters' scroll lengths + one screen (qa/spacer.test.ts keeps this equal to chapters/r0.ts) */
  #track { width: 1px; height: 570vh; }
  @supports (height: 100lvh) { @media (pointer: coarse) { #track { height: 570lvh; } } }
  canvas#gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity .9s ease-out; }
  @media (pointer: coarse) { canvas#gl { height: 100svh; } }

  /* the intro: covers the first load, then lifts into the dark the opening rises from */
  #intro { position: fixed; inset: 0; z-index: 5; background: #000; display: grid; place-content: center; text-align: center;
    transition: opacity .8s ease-out; }
  #intro.is-gone { opacity: 0; pointer-events: none; }
  #intro .ar { margin: 0; font: 400 clamp(44px, 12vw, 72px)/1.8 var(--arabic); color: var(--gold); direction: rtl; padding-bottom: .3em;
    text-shadow: 0 0 36px rgba(201, 164, 91, .16); }
  #intro .en { margin: 0; font: 400 15px/1.4 var(--serif); letter-spacing: .02em; color: var(--text); }
  #intro .rail { width: 120px; height: 1px; margin: 26px auto 0; background: rgba(201, 164, 91, .16); overflow: hidden; }
  #intro-line { height: 100%; background: var(--gold); transform-origin: left; transform: scaleX(0); transition: transform .3s ease-out; }

  #wait { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4;
    margin: 0; font: 11px/1.4 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    opacity: 0; transition: opacity .5s ease; pointer-events: none; white-space: nowrap; }
  #wait.is-on { opacity: .85; }
  #hud { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 6; max-width: calc(100vw - 20px);
    font: 10.5px/1.5 ui-monospace, Menlo, monospace; color: #C9A45B; background: rgba(0,0,0,.45); padding: 3px 6px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #intro, canvas#gl, #wait { transition: none; } }
</style>
</head>
<body>
<main aria-label="Al-Fātiḥah">
  <div id="track" aria-hidden="true"></div>
  <canvas id="gl" role="img" aria-label="A rolled parchment in the dark unrolls as you scroll"></canvas>
  <div id="intro" role="status" aria-label="Loading">
    <p class="ar" lang="ar">ٱلْفَاتِحَة</p>
    <p class="en">Al-Fātiḥah · The Opening</p>
    <div class="rail" aria-hidden="true"><div id="intro-line"></div></div>
  </div>
  <p id="wait" role="status">The page is being prepared</p>
  <div id="hud" hidden></div>
</main>
<script type="module" src="/src/boot.ts"></script>
</body>
</html>
